<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Адмін-панель: Галерея</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center text-primary mb-4">🎨 Адміністрування галереї</h1>

    <div class="mb-3">
        <a href="/new" class="btn btn-success">➕ Додати нову картину</a>
    </div>

    <table class="table table-striped table-hover table-bordered align-middle">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Назва</th>
            <th>Автор</th>
            <th>Опис</th>
            <th>Зображення</th>
            <th>Дії</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="painting : ${paintings}">
            <td th:text="${painting.id}">1</td>
            <td th:text="${painting.title}">Зоряна ніч</td>
            <td th:text="${painting.artist}">Вінсент ван Гог</td>
            <td th:text="${painting.description}">Опис картини</td>
            <td>
                <img th:src="${painting.imageUrl}" alt="Картина" style="max-width: 100px; border-radius: 5px;">
            </td>
            <td>
                <a th:href="@{/edit/{id}(id=${painting.id})}" class="btn btn-sm btn-warning">Редагувати</a>
                <a th:href="@{/delete/{id}(id=${painting.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Ви впевнені, що хочете видалити цю картину?')">Видалити</a>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${#lists.isEmpty(paintings)}" class="alert alert-info text-center">
        У базі даних поки що немає картин.
    </div>
</div>
</body>
</html>
