<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Додати/Редагувати картину</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2 class="text-center mb-4 text-success">🎨 Додати / Редагувати картину</h2>

    <form th:action="@{/save}" th:object="${painting}" method="post" class="w-50 mx-auto card p-4 shadow-sm">

        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
            <label class="form-label fw-bold">Назва:</label>
            <input type="text" th:field="*{title}" class="form-control" required placeholder="Наприклад: Мона Ліза" />
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Автор:</label>
            <input type="text" th:field="*{artist}" class="form-control" required placeholder="Наприклад: Леонардо да Вінчі" />
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Опис:</label>
            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Посилання на зображення (URL):</label>
            <input type="text" th:field="*{imageUrl}" class="form-control" placeholder="https://..." />
        </div>

        <div class="text-center mt-4">
            <button type="submit" class="btn btn-success px-4">Зберегти</button>
            <a href="/" class="btn btn-secondary px-4">Скасувати</a>
        </div>
    </form>
</div>
</body>
</html>
